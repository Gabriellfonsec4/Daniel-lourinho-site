<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">

  <title>Painel | Daniel Lourinho</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <main class="shell">

    <!-- ÁREA DE LOGIN -->

    <section class="login" id="login">

      <div class="brand">

        <span>DL</span>

        <div>

          <b>Daniel Lourinho</b>

          <small>Painel administrativo</small>

        </div>

      </div>

      <h1>Acessar agenda</h1>

      <p>
        Entre com o e-mail e a senha cadastrados no sistema.
      </p>

      <form id="login-form">

        <label for="email">
          E-mail

          <input id="email" type="email" autocomplete="email" placeholder="seuemail@email.com" required>
        </label>

        <label for="password">
          Senha

          <input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
        </label>

        <button type="submit">
          Entrar
        </button>

        <p class="message" id="login-message" role="status"></p>

      </form>

    </section>


    <!-- PAINEL ADMINISTRATIVO -->

    <section class="dashboard hidden" id="dashboard">

      <header>

        <div>

          <p>PAINEL ADMINISTRATIVO</p>

          <h1>Agenda</h1>

        </div>

        <button class="outline" id="logout" type="button">
          Sair
        </button>

      </header>

      <div class="filters">

        <label for="filter-date">
          Data

          <input id="filter-date" type="date">
        </label>

        <button class="outline" id="today" type="button">
          Hoje
        </button>

        <button class="outline" id="refresh" type="button">
          Atualizar
        </button>

      </div>

      <div class="stats">

        <article>

          <span>Pendentes</span>

          <strong id="pending-count">
            0
          </strong>

        </article>

        <article>

          <span>Confirmados</span>

          <strong id="confirmed-count">
            0
          </strong>

        </article>

        <article>

          <span>Total ativo</span>

          <strong id="total-count">
            0
          </strong>

        </article>

      </div>

      <div class="booking-list" id="booking-list">

        <p class="empty">
          Carregando agenda...
        </p>

      </div>

      <p class="message" id="dashboard-message" role="status"></p>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="admin.js"></script>

</body>

</html>
